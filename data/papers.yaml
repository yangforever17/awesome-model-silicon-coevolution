# Per-entry annotations, keyed by the BibTeX key in refs.bib.
#
#   topic     topic id from taxonomy.yaml
#   type      Paper (default) | Survey | Benchmark | Dataset | Tool | Industry | Essay | Book
#   level     autonomy level L0–L4, or Human (cross-layer work executed by human teams),
#             Claimed (stated by the organization, not verifiable), Undisclosed
#   lsrc      survey  = level stated in the survey's tables or text
#             curator = assigned by the repository curators using the §3.4 criteria (shown with †)
#   featured  marked ⭐ as a key work
#   short     short name; a leading "short: " in the note is dropped in the README
#   title_en  English title for non-English sources (the original is shown in parentheses)
#   url / arxiv / doi            manual link overrides
#   code      official GitHub repository as owner/repo (shown with a live star badge)
#   no_doi / no_arxiv            drop a wrong automatic match
#   ignore_bib_url               drop a wrong url field from refs.bib
#   note      one-line summary of the entry's role in the survey


      <path d="M94 42h84l13 28h-110z" fill="#f0f0eb"/><text x="136" y="61" fill="#3a3a36" stroke="none">Stack</text>

        <path d="M106 16 H44 V93 H66" fill="none" stroke="#2b6fd6" stroke-width="2.6" marker-end="url(#ah-n)"/>

// ---------------------------------------------------------------- render
function itemHTML([kind, name, desc]) {
  return `<div class="item ${kind === 'open' ? 'open' : ''}"><div class="tile ${TILE[kind]}">${G[GLYPH[kind]]}</div>
    <div class="txt"><div class="name">${name}</div><div class="desc">${desc}</div></div></div>`;
}
const chipsHTML = (cs) => `<div class="chips">${cs.map(([k, t]) => `<span class="chip ${k}">${t}</span>`).join('')}</div>`;

const root = document.getElementById('cols');
for (const c of COLS) {
  const el = document.createElement('div');
  el.className = 'col ' + (c.cls || '');
  el.style.left = c.x + 'px'; el.style.width = c.w + 'px';
  let body;
  if (c.split) {
    body = `<div class="split"><div><div class="head"><span>${c.head[0]}</span></div>${c.items.map(itemHTML).join('')}${chipsHTML(c.chips)}</div>
            <div><div class="head"><span>${c.head[1]}</span></div>${c.items2.map(itemHTML).join('')}${chipsHTML(c.chips2)}</div></div>`;
  } else {
    body = `<div class="head"><span>${c.head[0]}</span><span>${c.head[1]}</span></div>${c.items.map(itemHTML).join('')}${chipsHTML(c.chips)}`;
  }
  const sceneBottom = 10 + c.rise;
  el.innerHTML = body + `<div class="scene" style="bottom:${sceneBottom}px"><div class="ttl hand">${c.title}</div>${SCENES[c.scene]()}</div>`
    + (c.inset ? `<div class="inset">${insetTower()}</div>` : '');
  root.appendChild(el);
}
// L5–L6 ghost: drawn as a slim strip inside the L4 column's right margin is too tight, so it rides on the axis instead.

// legend
document.getElementById('legend').innerHTML = `
  <span class="title">Layer edge</span>
  <div class="grp">
    <span class="lab"><span class="tile t-ms" style="width:30px;height:30px;flex-basis:30px;border-radius:9px">${G.ms}</span>Model → Silicon</span>
    <span class="lab"><span class="tile t-mk" style="width:30px;height:30px;flex-basis:30px;border-radius:9px">${G.mk}</span>Model → Stack</span>
    <span class="lab"><span class="tile t-sm" style="width:30px;height:30px;flex-basis:30px;border-radius:9px">${G.sm}</span>Silicon → Model</span>
    <span class="lab"><span class="tile t-lp" style="width:30px;height:30px;flex-basis:30px;border-radius:9px">${G.lp}</span>Cross-layer loop</span>
    <span class="lab"><span class="tile t-claim" style="width:30px;height:30px;flex-basis:30px;border-radius:9px">${G.lp}</span>Claimed</span>
  </div>
  <span class="sep"></span>
  <span class="title">Mechanism</span>
  <div class="grp" style="gap:8px">
    <span class="chip legend k-data">Data</span>
    <span class="chip legend k-fb">Feedback & verification</span>
    <span class="chip legend k-search">Search & RL</span>
    <span class="chip legend k-agent">Agents</span>
    <span class="chip legend k-loop">Cross-layer</span>
  </div>`;

// x-axis labels
for (const [lv, name, x, dim] of XLABELS) {
  const d = document.createElement('div');
  d.className = 'xlabel hand' + (dim ? ' dim' : '');
  d.style.left = x + 'px';
  d.innerHTML = `<b>${lv}</b>${name}`;
  document.body.appendChild(d);
}
const far = document.createElement('div');
far.className = 'xlabel hand dim'; far.style.left = '2022px'; far.style.top = '992px'; far.style.fontSize = '22px';
far.style.transform = 'translateX(-100%)'; far.textContent = 'L5 self-expansion · L6 open-ended evolution →';
document.body.appendChild(far);

// rising dashed trajectory through each column's title
function drawTrail() {
  const pts = [];
  document.querySelectorAll('.col .ttl').forEach((t, i) => {
    const r = t.getBoundingClientRect();
    if (i === 0) pts.push([r.right - 8, r.top - 8]);
    else pts.push([r.left - 4, r.top - 14]);
  });
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) d += ` L${pts[i][0]} ${pts[i][1]}`;
  document.getElementById('trail').innerHTML =
    `<defs><marker id="tr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22305c"/></marker></defs>
     <path d="${d}" fill="none" stroke="#22305c" stroke-width="3" stroke-dasharray="11 8" stroke-linejoin="round" marker-end="url(#tr)"/>
     <circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="6.5" fill="#22305c"/>`;
}
document.fonts.ready.then(drawTrail);
</script>
</body>

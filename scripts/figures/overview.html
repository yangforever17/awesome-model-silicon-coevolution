<!doctype html>
<!--
  Figure 1: overview of model–stack–silicon co-evolution by autonomy level.
  Edit the COLS data below, then render: bash scripts/figures/render.sh  (headless Chrome → assets/overview.png)
  Work counts in the column headers come from data/catalog.csv (level column).
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Patrick+Hand&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #17203a;
    --muted: #5d6679;
    --dash: #2a3763;
    --ms-fill: #fbd38d; --ms-ink: #a2510b;   /* Model → Silicon */
    --mk-fill: #95e0d3; --mk-ink: #0f766e;   /* Model → Stack */
    --sm-fill: #f9b4c6; --sm-ink: #be123c;   /* Silicon → Model */
    --lp-fill: #cfc0ff; --lp-ink: #6d28d9;   /* Cross-layer loop */
    --c-data: #eeeafe; --c-data-b: #cfc4f6;
    --c-fb: #e3edfe; --c-fb-b: #b5cbf3;
    --c-search: #e0f5e8; --c-search-b: #a7dbba;
    --c-agent: #fff3d6; --c-agent-b: #efd389;
    --c-loop: #fee6e9; --c-loop-b: #f2b2bb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body { width: 2040px; height: 1030px; position: relative; font-family: Inter, sans-serif; color: var(--ink); overflow: hidden;
         background: radial-gradient(1200px 500px at 85% -10%, #f3f0ff 0%, rgba(255,255,255,0) 60%),
                     radial-gradient(900px 500px at 5% 110%, #eef4ff 0%, rgba(255,255,255,0) 60%), #fff; }
  .hand { font-family: "Patrick Hand", cursive; }

  /* axes */
  #yaxis { position: absolute; left: 14px; top: 16px; width: 3px; height: 902px; background: var(--ink); border-radius: 2px; }
  #yaxis::before { content: ""; position: absolute; top: -10px; left: -7px; border: 8.5px solid transparent; border-bottom: 13px solid var(--ink); border-top: 0; }
  #xaxis { position: absolute; left: 14px; top: 916px; width: 2006px; height: 3px; background: var(--ink); border-radius: 2px; }
  #xaxis::after { content: ""; position: absolute; right: -11px; top: -7px; border: 8.5px solid transparent; border-left: 13px solid var(--ink); border-right: 0; }
  .xlabel { position: absolute; top: 926px; font-size: 44px; line-height: 1; white-space: nowrap; transform: translateX(-50%); }
  .xlabel b { font-weight: 400; font-size: 54px; margin-right: 8px; }
  .xlabel.dim { color: #b2b9c6; }

  /* legend row */
  #legend { position: absolute; left: 40px; top: 12px; right: 20px; height: 56px; display: flex; align-items: center; gap: 14px; }
  .lgbox { display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-radius: 14px; background: rgba(255,255,255,.85);
           border: 1.5px solid #e3e7f0; box-shadow: 0 1px 2px rgba(23,32,58,.04); font-size: 17px; font-weight: 500; }
  .lgbox .title { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-right: 2px; }
  .lab { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .chip.legend { font-size: 14.5px; padding: 4px 10px; }
  .note { margin-left: auto; font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .note .cnt { font-weight: 700; color: var(--ink); background: #fff; border: 1.5px solid #dfe3ec; border-radius: 999px; padding: 2px 9px; font-size: 13px; }

  /* columns */
  .col { position: absolute; top: 80px; height: 822px; border: 2.6px dashed var(--dash); border-radius: 6px; padding: 12px 12px 0; overflow: hidden;
         background-color: #f8f9fc;
         background-image: radial-gradient(rgba(42,55,99,.12) 1px, transparent 1.3px),
                           linear-gradient(180deg, rgba(255,255,255,.0) 40%, var(--floor) 100%);
         background-size: 15px 15px, 100% 100%; }
  .col.human { border-color: #98a1b5; }
  .hdr { display: flex; align-items: center; gap: 8px; margin: 0 2px 9px; }
  .pill { color: #fff; font-weight: 800; font-size: 14px; letter-spacing: .02em; padding: 3px 10px; border-radius: 999px; }
  .hdr .sub { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr .cnt { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--ink); background: #fff; border: 1.5px solid #dfe3ec; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .split > div:first-child { padding-right: 10px; border-right: 2.2px dashed #a7b0cb; }
  .split > div:last-child { padding-left: 10px; }
  .subhead { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin: 2px 2px 7px; display: flex; align-items: center; gap: 6px; }
  .subhead i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  .list { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 2; }
  .item { display: flex; align-items: center; gap: 10px; padding: 6px 9px 6px 7px; background: #fff; border: 1px solid #e4e8f1; border-radius: 11px;
          box-shadow: 0 1px 1px rgba(23,32,58,.04), 0 3px 8px -4px rgba(23,32,58,.14); }
  .tile { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; border: 2px solid; }
  .tile svg { width: 20px; height: 20px; }
  .t-ms { background: var(--ms-fill); border-color: var(--ms-ink); color: var(--ms-ink); }
  .t-mk { background: var(--mk-fill); border-color: var(--mk-ink); color: var(--mk-ink); }
  .t-sm { background: var(--sm-fill); border-color: var(--sm-ink); color: var(--sm-ink); }
  .t-lp { background: var(--lp-fill); border-color: var(--lp-ink); color: var(--lp-ink); }
  .t-claim { background: repeating-linear-gradient(135deg, var(--lp-fill) 0 4px, #fff 4px 8px); border-color: var(--lp-ink); color: var(--lp-ink); border-style: dashed; }
  .t-open { background: #fff; border: 2px dashed #a3acc2; color: #a3acc2; }
  .txt { min-width: 0; }
  .name { font-weight: 700; font-size: 15.5px; line-height: 1.15; letter-spacing: -.005em; }
  .desc { font-size: 13px; color: var(--muted); line-height: 1.25; margin-top: 2px; }
  .item.open { background: rgba(255,255,255,.55); border: 1.8px dashed #b9c1d4; box-shadow: none; }
  .item.open .name { color: #8d96ab; font-style: italic; }
  .item.open .desc { color: #a3abbb; }
  .item.hl { border: 2px solid var(--lp-ink); box-shadow: 0 0 0 4px rgba(109,40,217,.10), 0 6px 14px -6px rgba(109,40,217,.45); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; position: relative; z-index: 2; }
  .chip { font-size: 13.5px; padding: 4px 9px; border-radius: 7px; border: 1.5px solid; background: #fff; white-space: nowrap; font-weight: 500; }
  .k-data { background: var(--c-data); border-color: var(--c-data-b); }
  .k-fb { background: var(--c-fb); border-color: var(--c-fb-b); }
  .k-search { background: var(--c-search); border-color: var(--c-search-b); }
  .k-agent { background: var(--c-agent); border-color: var(--c-agent-b); }
  .k-loop { background: var(--c-loop); border-color: var(--c-loop-b); }

  .scene { position: absolute; left: 0; right: 0; text-align: center; z-index: 2; }
  .scene .ttl { font-size: 37px; line-height: 1.0; color: var(--ink); text-shadow: 0 0 4px #fff, 0 0 8px #fff, 0 0 12px rgba(255,255,255,.9); }
  .human .scene .ttl { color: #6b7385; }
  .scene svg { display: block; margin: 2px auto 0; overflow: visible; }

  .inset { position: absolute; left: 12px; right: 12px; bottom: 12px; border: 1.5px solid #d3d9e6; border-radius: 12px; background: rgba(255,255,255,.95);
           padding: 8px 10px 4px; z-index: 3; box-shadow: 0 6px 18px -10px rgba(23,32,58,.35); }
  .inset .cap { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--muted); }

  #trail { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; }
</style>
</head>

<script>

};
const TILE = { ms: 't-ms', mk: 't-mk', sm: 't-sm', lp: 't-lp', claim: 't-claim', open: 't-open' };

// ---------------------------------------------------------------- data

const COLS = [

// ---------------------------------------------------------------- illustration kit
const NAVY = '#1e3a6e';
function shadow(cx, cy, rx) { return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${rx * 0.16}" fill="#1e3a6e" opacity=".13"/>`; }
// Robot: 70 x 100 local box; arms: 'down' | 'up' | 'forward'.
function robot(x, y, s = 1, { left = 'down', right = 'forward', chest = 'light', flip = false } = {}) {
  const arm = (side, pose) => {
    const sx = side === 'L' ? 15 : 55, dir = side === 'L' ? -1 : 1;
    const end = pose === 'up' ? [sx + dir * 12, 40] : pose === 'forward' ? [sx + dir * 16, 58] : [sx + dir * 9, 76];
    const d = `M${sx} 58 Q ${sx + dir * 8} ${(58 + end[1]) / 2 + 4} ${end[0]} ${end[1]}`;
    return `<path d="${d}" fill="none" stroke="${NAVY}" stroke-width="8.5" stroke-linecap="round"/>
            <path d="${d}" fill="none" stroke="#4d7fe8" stroke-width="4.6" stroke-linecap="round"/>
            <circle cx="${end[0]}" cy="${end[1]}" r="5" fill="#dbe7ff" stroke="${NAVY}" stroke-width="2.2"/>`;
  };
  const chestArt = chest === 'chip'
    ? `<rect x="26" y="58" width="18" height="18" rx="3" fill="url(#gChip)" stroke="#a2510b" stroke-width="1.8"/><rect x="31" y="63" width="8" height="8" rx="1.5" fill="url(#gDie)"/>`
    : `<rect x="24" y="58" width="22" height="15" rx="5" fill="#e6efff" stroke="${NAVY}" stroke-width="1.8"/><circle cx="30.5" cy="65.5" r="2.6" fill="#22d3ee"/><circle cx="39.5" cy="65.5" r="2.6" fill="#fbbf24"/>`;
  return `<g transform="translate(${x},${y}) scale(${flip ? -s : s},${s})${flip ? ' translate(-70,0)' : ''}">
    ${shadow(35, 100, 30)}
    <rect x="21" y="80" width="11" height="18" rx="5" fill="#2f5fc4" stroke="${NAVY}" stroke-width="2.4"/>
    <rect x="38" y="80" width="11" height="18" rx="5" fill="#2f5fc4" stroke="${NAVY}" stroke-width="2.4"/>
    ${arm('L', left)}
    <rect x="13" y="48" width="44" height="37" rx="15" fill="url(#gBody)" stroke="${NAVY}" stroke-width="2.6"/>
    ${chestArt}
    ${arm('R', right)}
    <line x1="35" y1="9" x2="35" y2="-1" stroke="${NAVY}" stroke-width="2.6"/>
    <circle cx="35" cy="-3" r="5" fill="#fbbf24" stroke="${NAVY}" stroke-width="2.2"/>
    <circle cx="5" cy="28" r="4.5" fill="#a9c2f7" stroke="${NAVY}" stroke-width="2.2"/><circle cx="65" cy="28" r="4.5" fill="#a9c2f7" stroke="${NAVY}" stroke-width="2.2"/>
    <rect x="6" y="8" width="58" height="42" rx="17" fill="url(#gHead)" stroke="${NAVY}" stroke-width="2.6"/>
    <path d="M14 18 q 6 -6 18 -6" stroke="#fff" stroke-opacity=".55" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="13" y="17" width="44" height="26" rx="11" fill="#16234a" stroke="${NAVY}" stroke-width="2"/>
    <g filter="url(#fEye)"><rect x="23" y="23" width="7" height="10" rx="3.5" fill="#67e8f9"/><rect x="40" y="23" width="7" height="10" rx="3.5" fill="#67e8f9"/></g>
    <path d="M30 37.5 q 5 3.2 10 0" stroke="#67e8f9" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>`;
}
function chip(x, y, s = 1, label = '') {
  let pins = '';
  for (const p of [13, 24, 35]) pins += `<path d="M${p} 0v-8M${p} 48v8M0 ${p}h-8M48 ${p}h8"/>`;
  return `<g transform="translate(${x},${y}) scale(${s})">

        ${[7, 16, 25].map(y => `<circle cx="${x + 4}" cy="${y}" r="1.7" fill="#4ade80"/><path d="M${x + 7} ${y}h3" stroke="#94a3b8" stroke-width="1.4"/>`).join('')}`).join('')}

    <text x="${C[0]}" y="${C[1] + 56}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11.5" fill="#475569">training</text>
    <!-- human sign-off: a barrier arm across the deploy arc -->

      <circle cx="20.5" cy="-22" r="5.5" fill="#fbbf24" stroke="${NAVY}" stroke-width="1.8"/>
      <path d="M20 -20 L-30 -12" stroke="${NAVY}" stroke-width="9" stroke-linecap="round"/>
      <path d="M20 -20 L-30 -12" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>

      <g transform="translate(40,-4)" stroke="#334155" stroke-width="1.8">
        <path d="M-10 18c0-10 4-14 10-14s10 4 10 14z" fill="#94a3b8"/>

// ---------------------------------------------------------------- render
function itemHTML([kind, name, desc, extra]) {
  return `<div class="item ${kind === 'open' ? 'open' : ''} ${extra || ''}"><div class="tile ${TILE[kind]}">${G[GLYPH[kind]]}</div>
    <div class="txt"><div class="name">${name}</div><div class="desc">${desc}</div></div></div>`;
}
const listHTML = (xs) => `<div class="list">${xs.map(itemHTML).join('')}</div>`;
const chipsHTML = (cs) => `<div class="chips">${cs.map(([k, t]) => `<span class="chip ${k}">${t}</span>`).join('')}</div>`;

const root = document.getElementById('cols');
for (const c of COLS) {
  const el = document.createElement('div');
  el.className = 'col ' + (c.cls || '');
  el.style.left = c.x + 'px'; el.style.width = c.w + 'px';
  el.style.setProperty('--floor', c.floor);
  const hdr = `<div class="hdr"><span class="pill" style="background:${c.color}">${c.pill}</span><span class="sub">${c.sub}</span><span class="cnt">${c.count}</span></div>`;
  let body;
  if (c.split) {
    const sh = ([t, col]) => `<div class="subhead"><i style="background:${col}"></i>${t}</div>`;
    body = `<div class="split"><div>${sh(c.heads[0])}${listHTML(c.items)}${chipsHTML(c.chips)}</div>
            <div>${sh(c.heads[1])}${listHTML(c.items2)}${chipsHTML(c.chips2)}</div></div>`;
  } else {
    body = listHTML(c.items) + chipsHTML(c.chips);
  }
  el.innerHTML = hdr + body
    + `<div class="scene" style="bottom:${8 + c.rise}px"><div class="ttl hand">${c.title}</div>${SCENES[c.scene]()}</div>`
    + (c.inset ? `<div class="inset">${insetTower()}</div>` : '');
  root.appendChild(el);
}

const far = document.createElement('div');

// rising trajectory through each column's title, colored by level
function drawTrail() {
  const pts = [], cols = [];
  document.querySelectorAll('.col .ttl').forEach((t, i) => {
    const r = t.getBoundingClientRect();
    pts.push([(r.left + r.right) / 2, r.top - 18]);
    cols.push(COLS[i].color);
  });
  const x0 = pts[0][0], x1 = pts[pts.length - 1][0];
  const stops = pts.map((p, i) => `<stop offset="${((p[0] - x0) / (x1 - x0)).toFixed(3)}" stop-color="${cols[i]}"/>`).join('');
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) d += ` L${pts[i][0]} ${pts[i][1]}`;
  const dots = pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 9 : 7}" fill="#fff" stroke="${cols[i]}" stroke-width="4"/>`).join('');
  document.getElementById('trail').innerHTML = `
    <defs><linearGradient id="gTrail" gradientUnits="userSpaceOnUse" x1="${x0}" y1="0" x2="${x1}" y2="0">${stops}</linearGradient></defs>
    <path d="${d}" fill="none" stroke="#fff" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>
    <path d="${d}" fill="none" stroke="url(#gTrail)" stroke-width="5" stroke-dasharray="14 10" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}`;
}
document.fonts.ready.then(drawTrail);

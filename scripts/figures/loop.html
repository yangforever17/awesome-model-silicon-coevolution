<!doctype html>
<!--
  Survey overview: the model–stack–silicon co-evolution loop and how the survey is organised (§2–§8).
  Render: bash scripts/figures/render.sh  (assets/loop.png, assets/loop.pdf)
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Patrick+Hand&display=block" rel="stylesheet">
<style>
  @page { size: 1600px 1230px; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { background: #fff; }
  body { width: 1600px; height: 1230px; overflow: hidden; font-family: Inter, sans-serif; color: #17203a; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="fig" width="1600" height="1230" viewBox="0 0 1600 1230"></svg>
<script>
const NAVY = '#1e3a6e', INK = '#17203a';
const LOBE = 'https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@1.90.0/icons/';
const LOGO = { deepmind: LOBE + 'deepmind-color.svg', nvidia: LOBE + 'nvidia-color.svg', meta: LOBE + 'meta-color.svg',
  huawei: LOBE + 'huawei-color.svg', deepseek: LOBE + 'deepseek-color.svg', openai: LOBE + 'openai.svg', qwen: LOBE + 'qwen-color.svg' };

// ---------------------------------------------------------------- icon kit (all drawn in a 48×48 box at (x, y), scale s)
const g = (x, y, s, body) => `<g transform="translate(${x},${y}) scale(${s})">${body}</g>`;
const ST = `stroke="${NAVY}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"`;
const IC = {
  robot: (x, y, s = 1) => g(x, y, s, `
    <line x1="24" y1="6" x2="24" y2="1" ${ST}/><circle cx="24" cy="1" r="3" fill="#fbbf24" ${ST}/>
    <circle cx="5" cy="20" r="3.2" fill="#a9c2f7" ${ST}/><circle cx="43" cy="20" r="3.2" fill="#a9c2f7" ${ST}/>
    <rect x="6" y="6" width="36" height="28" rx="11" fill="url(#gHead)" ${ST}/>
    <rect x="11" y="12" width="26" height="16" rx="7" fill="#16234a"/>
    <rect x="16" y="15.5" width="4.5" height="7" rx="2.2" fill="#67e8f9"/><rect x="27.5" y="15.5" width="4.5" height="7" rx="2.2" fill="#67e8f9"/>
    <rect x="12" y="35" width="24" height="12" rx="5" fill="url(#gBody)" ${ST}/>
    <rect x="20" y="37.5" width="8" height="7" rx="1.5" fill="url(#gChip)" stroke="#a2510b" stroke-width="1.2"/>`),
  chip: (x, y, s = 1, label = '') => g(x, y, s, `
    <g stroke="#a2510b" stroke-width="2.4" stroke-linecap="round">${[14, 24, 34].map(p => `<path d="M${p} 4v5M${p} 39v5M4 ${p}h5M39 ${p}h5"/>`).join('')}</g>
    <rect x="9" y="9" width="30" height="30" rx="5" fill="url(#gChip)" stroke="#a2510b" stroke-width="2.2"/>
    <rect x="15" y="15" width="18" height="18" rx="3" fill="url(#gDie)"/>
    ${label ? `<text x="24" y="27.5" text-anchor="middle" font-weight="800" font-size="8" fill="#fde68a">${label}</text>` : ''}`),
  term: (x, y, s = 1, label = '>_') => g(x, y, s, `
    <rect x="3" y="7" width="42" height="34" rx="6" fill="#16234a" ${ST}/>
    <circle cx="9" cy="13" r="1.8" fill="#f87171"/><circle cx="15" cy="13" r="1.8" fill="#fbbf24"/><circle cx="21" cy="13" r="1.8" fill="#4ade80"/>
    <text x="9" y="32" font-weight="800" font-size="11" fill="#5eead4">${label}</text>`),
  net: (x, y, s = 1) => g(x, y, s, `
    <rect x="2" y="4" width="44" height="40" rx="9" fill="#efeaff" stroke="#7c5ce0" stroke-width="2"/>
    <g stroke="#7c3aed" stroke-width="1.6" fill="#fff"><path d="M10 24 L22 12 L36 18 M10 24 L22 24 L36 30 M10 24 L22 36 L36 30 M22 12 L36 30 M22 36 L36 18" fill="none" opacity=".7"/>
    ${[[10, 24], [22, 12], [22, 24], [22, 36], [36, 18], [36, 30]].map(([a, b]) => `<circle cx="${a}" cy="${b}" r="3.6"/>`).join('')}</g>`),
  doc: (x, y, s = 1, mark = 'spec') => g(x, y, s, `
    <path d="M9 3h21l10 10v32H9z" fill="#fff" ${ST}/><path d="M30 3v10h10" fill="#e8eefb" ${ST}/>
    <text x="13" y="21" font-weight="800" font-size="8" fill="#2b6fd6">${mark}</text>
    <path d="M14 28h20M14 34h14M14 40h18" stroke="#a9bbdd" stroke-width="2.4" stroke-linecap="round"/>`),
  wafer: (x, y, s = 1) => g(x, y, s, `
    <circle cx="24" cy="24" r="20" fill="url(#gChip)" stroke="#a2510b" stroke-width="2.2"/>
    <g stroke="#a2510b" stroke-width="1" opacity=".6">${[-14, -7, 0, 7, 14].map(v => `<path d="M${24 + v} 6V42M6 ${24 + v}H42"/>`).join('')}</g>
    <path d="M18 43.5h12" stroke="#a2510b" stroke-width="3"/>`),
  bars: (x, y, s = 1) => g(x, y, s, `
    <rect x="3" y="6" width="42" height="36" rx="6" fill="#fff" ${ST}/>
    <rect x="9" y="13" width="28" height="6" rx="2" fill="#fca5a5"/><rect x="9" y="22" width="19" height="6" rx="2" fill="#fcd34d"/><rect x="9" y="31" width="10" height="6" rx="2" fill="#86efac"/>`),
  crate: (x, y, s = 1, up = true) => g(x, y, s, `
    <rect x="6" y="18" width="36" height="24" rx="3" fill="url(#gWood)" stroke="#8a5a1c" stroke-width="2"/>
    <path d="M6 26H42M6 34H42" stroke="#b9853e" stroke-width="1.2"/>
    ${up ? `<path d="M24 15V3M18 9l6-6 6 6" fill="none" stroke="#be123c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>` : ''}`),
  loop: (x, y, s = 1, c = '#16a34a') => g(x, y, s, `
    <path d="M40 22a16 16 0 0 0-28.6-9.2M8 26a16 16 0 0 0 28.6 9.2" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 4l1.4 9 9-1.4M38 44l-1.4-9-9 1.4" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`),
  person: (x, y, s = 1, c = '#64748b') => g(x, y, s, `
    <circle cx="24" cy="14" r="8" fill="#f3d5b8" ${ST}/><path d="M17 12c1-9 14-9 15 0c-4-3-11-3-15 0z" fill="#334155"/>
    <path d="M8 46c0-14 7-21 16-21s16 7 16 21z" fill="${c}" ${ST}/>`),
  book: (x, y, s = 1) => g(x, y, s, `
    <path d="M4 10c8-3 14-2 20 2v30c-6-4-12-5-20-2z" fill="#e0e7ff" ${ST}/><path d="M44 10c-8-3-14-2-20 2v30c6-4 12-5 20-2z" fill="#c7d2fe" ${ST}/>
    <path d="M9 18c4-1 7-1 10 1M9 25c4-1 7-1 10 1M29 19c3-2 6-2 10-1M29 26c3-2 6-2 10-1" stroke="#6366f1" stroke-width="1.6" fill="none"/>`),
  target: (x, y, s = 1) => g(x, y, s, `
    <circle cx="22" cy="26" r="18" fill="#fff" stroke="#dc2626" stroke-width="2.4"/><circle cx="22" cy="26" r="11" fill="#fecaca" stroke="#dc2626" stroke-width="2.2"/>
    <circle cx="22" cy="26" r="4.5" fill="#dc2626"/><path d="M22 26 L42 6" stroke="${NAVY}" stroke-width="2.6"/><path d="M36 4l7 1-1 7" fill="#fbbf24" ${ST}/>`),
  shield: (x, y, s = 1) => g(x, y, s, `
    <path d="M24 4l17 6v12c0 12-8 19-17 22c-9-3-17-10-17-22V10z" fill="#fee2e2" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M24 15v12" stroke="#dc2626" stroke-width="3.4" stroke-linecap="round"/><circle cx="24" cy="33" r="2.2" fill="#dc2626"/>`),
  flask: (x, y, s = 1) => g(x, y, s, `
    <path d="M18 4h12M20 4v13L8 39a4 4 0 0 0 3.5 6h25A4 4 0 0 0 40 39L28 17V4" fill="#fff" ${ST}/>
    <path d="M13 31h22l4 8a4 4 0 0 1-3.5 6h-23A4 4 0 0 1 9 39z" fill="#86efac"/><circle cx="20" cy="37" r="2" fill="#fff"/><circle cx="27" cy="34" r="1.6" fill="#fff"/>`),
  gym: (x, y, s = 1) => g(x, y, s, `
    <rect x="4" y="16" width="6" height="16" rx="2" fill="#475569"/><rect x="10" y="12" width="6" height="24" rx="2" fill="#64748b"/>
    <rect x="38" y="16" width="6" height="16" rx="2" fill="#475569"/><rect x="32" y="12" width="6" height="24" rx="2" fill="#64748b"/>
    <rect x="16" y="22" width="16" height="4" rx="2" fill="#94a3b8"/>`),
  rack: (x, y, s = 1) => g(x, y, s, `
    ${[0, 1].map(i => `<rect x="${6 + i * 19}" y="4" width="17" height="40" rx="3" fill="#334155" ${ST}/>${[12, 22, 32].map(yy => `<circle cx="${11 + i * 19}" cy="${yy}" r="2" fill="#4ade80"/><path d="M${15 + i * 19} ${yy}h5" stroke="#94a3b8" stroke-width="1.6"/>`).join('')}`).join('')}`),
  globe: (x, y, s = 1) => g(x, y, s, `
    <circle cx="24" cy="24" r="19" fill="#dbeafe" ${ST}/><path d="M5 24h38M24 5c-7 6-7 32 0 38M24 5c7 6 7 32 0 38" fill="none" ${ST}/>
    <path d="M9 14c9 4 21 4 30 0M9 34c9-4 21-4 30 0" fill="none" stroke="${NAVY}" stroke-width="1.6"/>`),
  mountain: (x, y, s = 1, c = '#7c3aed') => g(x, y, s, `
    <path d="M2 44 L18 16 L26 28 L32 20 L46 44Z" fill="#e9e3ff" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M18 16 L14 23 L18 21 L22 24Z" fill="#fff"/><path d="M18 16V4" stroke="${NAVY}" stroke-width="2"/><path d="M18 4h10l-3 3 3 3H18z" fill="#ef4444"/>`),
  gauge: (x, y, s = 1) => g(x, y, s, `
    <path d="M6 34a18 18 0 0 1 36 0" fill="none" stroke="#e2e8f0" stroke-width="7"/>
    <path d="M6 34a18 18 0 0 1 9-15.6" fill="none" stroke="#ef4444" stroke-width="7"/><path d="M15 18.4a18 18 0 0 1 18 0" fill="none" stroke="#fbbf24" stroke-width="7"/>
    <path d="M33 18.4a18 18 0 0 1 9 15.6" fill="none" stroke="#22c55e" stroke-width="7"/><path d="M24 34 L35 22" stroke="${NAVY}" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="34" r="3.5" fill="${NAVY}"/>`),
  clock: (x, y, s = 1) => g(x, y, s, `
    <circle cx="24" cy="26" r="17" fill="#fff" ${ST}/><path d="M24 15v11l7 4" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/><rect x="19" y="3" width="10" height="5" rx="1.5" fill="${NAVY}"/>`),
  barrier: (x, y, s = 1) => g(x, y, s, `
    <rect x="36" y="14" width="6" height="30" rx="2" fill="#475569"/><circle cx="39" cy="14" r="4.5" fill="#fbbf24" ${ST}/>
    <path d="M38 16 L4 28" stroke="${NAVY}" stroke-width="8" stroke-linecap="round"/><path d="M38 16 L4 28" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
    <path d="M38 16 L4 28" stroke="#fff" stroke-width="5" stroke-dasharray="5 5"/>`),
  gear: (x, y, s = 1, c = '#c9d8f6') => g(x, y, s, `
    ${[...Array(8)].map((_, i) => `<rect x="21" y="3" width="6" height="8" rx="1.5" transform="rotate(${i * 45} 24 24)" fill="${c}" ${ST}/>`).join('')}
    <circle cx="24" cy="24" r="13" fill="${c}" ${ST}/><circle cx="24" cy="24" r="5" fill="#fff" ${ST}/>`),
  fab: (x, y, s = 1) => g(x, y, s, `
    <path d="M3 44V24l10-6v6l10-6v6l10-6v26z" fill="#e2e8f0" ${ST}/><rect x="33" y="8" width="7" height="36" fill="#cbd5e1" ${ST}/>
    <path d="M36 6c0-4 6-4 6-1" fill="none" stroke="#94a3b8" stroke-width="2"/><rect x="9" y="32" width="6" height="6" fill="#fbbf24"/><rect x="20" y="32" width="6" height="6" fill="#fbbf24"/>`),
  sparkle: (x, y, s = 1, c = '#fbbf24') => `<path transform="translate(${x},${y}) scale(${s})" d="M0 -9 C1 -2 2 -1 9 0 C2 1 1 2 0 9 C-1 2 -2 1 -9 0 C-2 -1 -1 -2 0 -9z" fill="${c}"/>`,
};
const logo = (k, x, y, w = 22) => `<image href="${LOGO[k]}" x="${x}" y="${y}" width="${w}" height="${w}"/>`;

// ---------------------------------------------------------------- shared shapes
const bigArrow = (x, y, w, label, c = '#2a5b7c') => `<g transform="translate(${x},${y})">
  <path d="M0 -20 H${w - 26} V-34 L${w} 0 L${w - 26} 34 V20 H0 Z" fill="${c}"/>
  <text x="${(w - 26) / 2 + 2}" y="7" text-anchor="middle" font-weight="800" font-size="19" fill="#fff">${label}</text></g>`;
const grayArrow = (x, y, w = 40) => `<path d="M${x} ${y - 7} h${w - 14} v-7 l14 14 -14 14 v-7 h-${w - 14} z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round"/>`;
const tag = (x, y, t, c = '#475569', fill = '#fff', fs = 12.5) => {
  const w = 18 + t.length * fs * 0.56;
  return `<g transform="translate(${x - w / 2},${y - 12})"><rect width="${w}" height="24" rx="12" fill="${fill}" stroke="${c}" stroke-width="1.6"/>
    <text x="${w / 2}" y="16.5" text-anchor="middle" font-weight="600" font-size="${fs}" fill="${INK}">${t}</text></g>`;
};
const support = (x, y, label = 'Support') => {
  const w = label.length * 8 + 26;
  return `<g transform="translate(${x},${y})"><path d="M0 -13 H${w - 12} L${w} 0 L${w - 12} 13 H0 Z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="${(w - 12) / 2}" y="5" text-anchor="middle" font-weight="700" font-size="12" fill="${INK}">${label}</text></g>`;
};
const dotted = (x, y, w, h, c = '#94a3b8') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="#fff" fill-opacity=".72" stroke="${c}" stroke-width="2" stroke-dasharray="3 5"/>`;

let s = `<defs>
  <linearGradient id="gHead" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#78a8ff"/><stop offset="1" stop-color="#3d6fe0"/></linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b9bff"/><stop offset="1" stop-color="#3563d4"/></linearGradient>
  <linearGradient id="gChip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe2a8"/><stop offset="1" stop-color="#f7b955"/></linearGradient>
  <linearGradient id="gDie" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3a66"/><stop offset="1" stop-color="#121a33"/></linearGradient>
  <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d39b"/><stop offset="1" stop-color="#d9a55c"/></linearGradient>
  <linearGradient id="gBand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3faf2"/><stop offset=".5" stop-color="#eef3ff"/><stop offset="1" stop-color="#fdf0f6"/></linearGradient>
  <linearGradient id="gLoop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#f6f0ff"/></linearGradient>
  <marker id="arG" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
  <marker id="arO" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f97316"/></marker>
</defs>`;

// ================================================================= row 0: the loop as a story
s += IC.robot(34, 26, 1.7);
s += `<text x="74" y="136" text-anchor="middle" font-weight="800" font-size="18" fill="${INK}">Model</text>
      <text x="74" y="154" text-anchor="middle" font-weight="500" font-size="12.5" fill="#5d6679">designer & workload</text>`;
s += bigArrow(128, 76, 156, 'Design');
s += `<rect x="300" y="18" width="380" height="128" rx="18" fill="url(#gLoop)" stroke="#475569" stroke-width="2.4" stroke-dasharray="4 6"/>`;
s += IC.term(330, 34, 1.3, 'kernel') + IC.gear(410, 36, 1.15, '#a8e6d8') + IC.chip(486, 32, 1.35, 'RTL') + IC.wafer(566, 34, 1.3);
s += `<text x="490" y="128" text-anchor="middle" font-weight="800" font-size="20" fill="${INK}">Software stack + Silicon</text>`;
s += bigArrow(696, 76, 176, 'Train & serve');
s += IC.robot(896, 18, 2.05) + IC.sparkle(1000, 40, 1) + IC.sparkle(888, 104, .7, '#93c5fd');
s += `<text x="945" y="136" text-anchor="middle" font-weight="800" font-size="18" fill="${INK}">Successor model</text>
      <text x="945" y="154" text-anchor="middle" font-weight="500" font-size="12.5" fill="#5d6679">runs on what it built</text>`;
s += bigArrow(1010, 76, 150, 'Recurse');
s += `<rect x="1176" y="18" width="404" height="128" rx="18" fill="#fff" stroke="#475569" stroke-width="2.4" stroke-dasharray="4 6"/>`;
s += IC.fab(1206, 30, 1.4) + IC.rack(1290, 30, 1.4) + IC.mountain(1374, 26, 1.5) + IC.globe(1462, 30, 1.4);
s += `<text x="1378" y="128" text-anchor="middle" font-weight="800" font-size="20" fill="${INK}">Self-scaling intelligence</text>`;
s += `<path d="M945 160 V 174 H 74 V 166" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#arG)"/>
      <rect x="378" y="162" width="264" height="24" rx="12" fill="#fff"/>
      <text x="510" y="180" text-anchor="middle" font-family="Patrick Hand" font-size="18" fill="#15803d">the successor becomes the next designer</text>`;

// ================================================================= row 1: co-design → co-evolution
s += `<rect x="20" y="190" width="1560" height="92" rx="18" fill="url(#gBand)" stroke="#d6dbe6" stroke-width="1.4"/>
      <text x="44" y="230" font-weight="800" font-size="21" fill="${INK}">Co-design</text>${grayArrow(164, 223, 44)}
      <text x="218" y="230" font-weight="800" font-size="21" fill="${INK}">Co-evolution</text>
      <text x="196" y="262" text-anchor="middle" font-weight="700" font-size="16" fill="${INK}">(▷ §2–§3)</text>`;
const SHIFT = [
  { k: 'Problem', a: 'Fixed target', b: 'Moving target', ia: (x, y) => IC.target(x, y, .78), ib: (x, y) => IC.loop(x, y, .78, '#7c3aed') },
  { k: 'Executor', a: 'People', b: 'Model', ia: (x, y) => IC.person(x, y, .78), ib: (x, y) => IC.robot(x, y, .8) },
  { k: 'Feedback', a: 'One-shot', b: 'S1→S6 ladder', ia: (x, y) => IC.doc(x, y, .78, 'spec'), ib: (x, y) => IC.bars(x, y, .78) },
  { k: 'Autonomy', a: 'L0 assist', b: 'L4 recursive', ia: (x, y) => IC.person(x, y, .7, '#94a3b8'), ib: (x, y) => IC.loop(x, y, .78) },
];
SHIFT.forEach((t, i) => {
  const x0 = 384 + i * 284;
  s += `<rect x="${x0}" y="200" width="268" height="72" rx="12" fill="#fff" fill-opacity=".8" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="3 5"/>
        <text x="${x0 + 134}" y="220" text-anchor="middle" font-weight="700" font-size="13.5" fill="${INK}">${t.k}</text>
        ${t.ia(x0 + 34, 216)}${grayArrow(x0 + 114, 240, 40)}${t.ib(x0 + 196, 216)}
        ${tag(x0 + 58, 262, t.a, '#64748b', '#fff', 11)}${tag(x0 + 212, 262, t.b, '#64748b', '#fff', 11)}`;
});
s += `<text x="1546" y="234" text-anchor="middle" font-weight="700" font-size="14" fill="#475569">And</text>
      <text x="1546" y="252" text-anchor="middle" font-weight="700" font-size="14" fill="#475569">more…</text>`;

// ================================================================= panels
function panel({ x, y, w, h, c, bg, footer, cols, bullets, mini }) {
  let o = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="20" fill="${bg}" stroke="${c}" stroke-width="2.6"/>`;
  const cw = (w - 40) / 3;
  cols.forEach((col, i) => {
    const cx = x + 20 + i * cw;
    o += col.icon(cx + 8, y + 18) + `<text x="${cx + 80}" y="${y + 44}" font-weight="800" font-size="22" fill="${c}">${col.t1}</text>
         <text x="${cx + 80}" y="${y + 70}" font-weight="800" font-size="22" fill="${c}">${col.t2 || ''}</text>`;
    bullets[i].forEach((b, j) => o += `<text x="${cx + 12}" y="${y + 112 + j * 27}" font-weight="500" font-size="15.5" fill="${INK}"><tspan font-weight="800">➢</tspan>  ${b}</text>`);
  });
  o += mini(x, y + 196);
  o += `<text x="${x + w / 2}" y="${y + h - 18}" text-anchor="middle" font-weight="800" font-size="22" fill="${c}">${footer}</text>`;
  return o;
}
const PW = 770, PH = 412;

// ---- §4 design down / constraints up
s += panel({
  x: 20, y: 298, w: PW, h: PH, c: '#9a5b2a', bg: '#fffaf3',
